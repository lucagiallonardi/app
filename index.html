<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Recurso</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{background:#eef3f9;height:100vh;display:flex;justify-content:center;align-items:center;}

.phone{
  width:390px;height:844px;background:#fff;border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;flex-direction:column;overflow:hidden;
}

.header{
  padding:18px 20px;
  border-bottom:1px solid #eef2f7;
}

.back{font-size:12px;color:#7a8596;}

.content{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

.player{
  width:100%;
  height:200px;
  border-radius:18px;
  background:linear-gradient(135deg,#c7d2fe,#e0e7ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
}

.title{
  margin-top:14px;
  font-size:15px;
  font-weight:600;
}

.when{
  margin-top:6px;
  font-size:12px;
  color:#7a8596;
  line-height:1.4;
}
</style>
</head>

<body>
<div class="phone">

  <div class="header">
    <div class="back">‹ Atrás</div>
  </div>

  <div class="content">

    <div class="player">▶</div>

    <div class="title">Lo-fi Chill Mix</div>

    <div class="when">
      Cuando estés ansioso, disperso o necesites concentrarte.
    </div>

  </div>

</div>
</body>
</html>

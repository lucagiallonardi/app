<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nota para mí</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{background:#eef3f9;height:100vh;display:flex;justify-content:center;align-items:center;}

.phone{
  width:390px;height:844px;background:#fff;border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;flex-direction:column;overflow:hidden;
}

.header{
  padding:18px 20px;
  border-bottom:1px solid #eef2f7;
}

.back{font-size:12px;color:#7a8596;}

.content{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

.time{
  font-size:12px;
  color:#9aa6b2;
}

.note{
  margin-top:12px;
  padding:18px;
  border-radius:18px;
  border:1px solid #e6ecf5;
  background:#f7f9ff;
  font-size:14px;
  line-height:1.6;
  color:#2b2f36;
}
</style>
</head>

<body>
<div class="phone">

  <div class="header">
    <div class="back">‹ Atrás</div>
  </div>

  <div class="content">

    <div class="time">Hace 3 semanas te dejaste este mensaje</div>

    <div class="note">
      No todo lo que siento en días malos es real.  
      Ya pasé por esto antes y lo superé.
    </div>

  </div>

</div>
</body>
</html>

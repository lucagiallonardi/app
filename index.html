<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuerdos Emocionales</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <div class="login-card">

      <h1>Recuerdos Emocionales</h1>

      <p class="subtitle">
        Reviví no solo dónde estuviste, sino cómo te sentiste.
      </p>

      <input
        type="email"
        placeholder="Correo electrónico"
      >

      <input
        type="password"
        placeholder="Contraseña"
      >

      <button>
        Ingresar
      </button>

      <span class="register">
        Crear cuenta
      </span>

    </div>

  </div>

</body>
</html>

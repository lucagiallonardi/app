<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Perfil</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  background:linear-gradient(180deg,#f6f8fc 0%,#eef3f9 100%);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.phone{
  width:390px;
  height:844px;
  background:#fff;
  border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-shrink:0;
}

.title{
  font-size:16px;
  font-weight:600;
  color:#2b2f36;
}

/* CONTENT */
.content{
  flex:1;
  overflow-y:auto;
  padding:16px 20px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* PROFILE CARD */
.profile{
  background:linear-gradient(135deg,#eef3ff,#f7f9ff);
  border:1px solid #e6ecf5;
  border-radius:20px;
  padding:16px;
}

.name{
  font-size:16px;
  font-weight:600;
  color:#2b2f36;
}

.status{
  margin-top:6px;
  font-size:12px;
  color:#7a8596;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#f8fbff;
  border:1px solid #e6ecf5;
  border-radius:16px;
  padding:14px;
  text-align:center;
}

.stat-number{
  font-size:16px;
  font-weight:600;
  color:#4f7cff;
}

.stat-label{
  font-size:11px;
  color:#7a8596;
  margin-top:4px;
}

/* SECTION */
.section-title{
  font-size:12px;
  color:#9aa6b2;
  text-transform:uppercase;
}

/* CONTEXTS */
.contexts{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.context{
  padding:10px 12px;
  border-radius:14px;
  background:#fff;
  border:1px solid #e6ecf5;
  font-size:12px;
  color:#2b2f36;
}

/* SETTINGS */
.settings{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.setting{
  background:#fff;
  border:1px solid #e6ecf5;
  border-radius:14px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.setting-title{
  font-size:13px;
  color:#2b2f36;
}

.setting-desc{
  font-size:11px;
  color:#7a8596;
  margin-top:3px;
}

.toggle{
  width:38px;
  height:22px;
  border-radius:999px;
  background:#e6ecf5;
  position:relative;
}

.toggle::after{
  content:'';
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#fff;
  top:2px;
  left:2px;
}

/* NAV */
.nav{
  height:70px;
  border-top:1px solid #eef2f7;
  display:flex;
  justify-content:space-around;
  align-items:center;
  flex-shrink:0;
}

.nav-item{
  font-size:12px;
  color:#a0a9b8;
}

.active{
  color:#4f7cff;
}

</style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="title">Perfil</div>
  </div>

  <div class="content">

    <!-- PROFILE -->
    <div class="profile">
      <div class="name">Luca</div>
      <div class="status">Hoy estás en modo: “recuperando foco”</div>
    </div>

    <!-- STATS -->
    <div class="stats">

      <div class="stat">
        <div class="stat-number">24</div>
        <div class="stat-label">Recuerdos</div>
      </div>

      <div class="stat">
        <div class="stat-number">8</div>
        <div class="stat-label">Logros</div>
      </div>

      <div class="stat">
        <div class="stat-number">12</div>
        <div class="stat-label">Validaciones</div>
      </div>

      <div class="stat">
        <div class="stat-number">5</div>
        <div class="stat-label">Recursos</div>
      </div>

    </div>

    <!-- CONTEXTS -->
    <div>
      <div class="section-title">Contextos</div>

      <div class="contexts">
        <div class="context">Trabajo</div>
        <div class="context">Familia</div>
        <div class="context">Estudio</div>
        <div class="context">Salud</div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div>
      <div class="section-title">Configuración emocional</div>

      <div class="settings">

        <div class="setting">
          <div>
            <div class="setting-title">Recordatorios suaves</div>
            <div class="setting-desc">Te sugiere usar la app en días difíciles</div>
          </div>
          <div class="toggle"></div>
        </div>

        <div class="setting">
          <div>
            <div class="setting-title">Modo calma</div>
            <div class="setting-desc">Reduce estímulos visuales</div>
          </div>
          <div class="toggle"></div>
        </div>

      </div>

    </div>

  </div>

  <!-- NAV -->
  <div class="nav">
    <div class="nav-item">Inicio</div>
    <div class="nav-item">Buscar</div>
    <div class="nav-item active">Perfil</div>
  </div>

</div>

</body>
</html>

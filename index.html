<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Recuerdo</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  background:#eef3f9;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* DEVICE */
.phone{
  width:390px;
  height:844px;
  background:#fff;
  border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  padding:18px 20px;
  border-bottom:1px solid #eef2f7;
}

.back{
  font-size:12px;
  color:#7a8596;
}

/* CONTENT */
.content{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* MEDIA */
.media{
  width:100%;
  height:260px;
  border-radius:20px;
  background:linear-gradient(135deg,#c7d2fe,#e0e7ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  color:#4f7cff;
}

/* TEXT CARD */
.card{
  padding:16px;
  border-radius:18px;
  border:1px solid #e6ecf5;
  background:#fff;
}

.title{
  font-size:16px;
  font-weight:600;
  color:#2b2f36;
}

.desc{
  margin-top:6px;
  font-size:13px;
  color:#5f6b7a;
  line-height:1.5;
}

</style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="back">‹ Atrás</div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- IMAGE / VIDEO -->
    <div class="media">
      📸 / 🎬
    </div>

    <!-- TITLE + DESCRIPTION -->
    <div class="card">
      <div class="title">Ese día que lo lograste</div>
      <div class="desc">
        Este recuerdo representa un momento importante donde pensaste que no podías, pero lo hiciste igual.
      </div>
    </div>

  </div>

</div>

</body>
</html>

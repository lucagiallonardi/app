<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crear cuenta</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  background:linear-gradient(180deg,#f6f8fc 0%,#eef3f9 100%);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* DEVICE */
.phone{
  width:390px;
  height:844px;
  background:#fff;
  border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  padding:20px;
  border-bottom:1px solid #eef2f7;
}

.title{
  font-size:18px;
  font-weight:600;
  color:#2b2f36;
}

.subtitle{
  font-size:12px;
  color:#7a8596;
  margin-top:4px;
}

/* CONTENT */
.content{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* CARD */
.card{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:14px;
  border:1px solid #e6ecf5;
  border-radius:18px;
  background:#fff;
}

/* LABEL */
.label{
  font-size:11px;
  color:#9aa6b2;
  text-transform:uppercase;
  letter-spacing:0.4px;
  margin-bottom:6px;
}

/* INPUT */
input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #e6ecf5;
  background:#f9fbfd;
  font-size:13px;
  outline:none;
}

/* FOOTER */
.footer{
  padding:16px 20px;
  border-top:1px solid #eef2f7;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#4f7cff;
  color:#fff;
  font-size:14px;
  font-weight:600;
}

.helper{
  font-size:11px;
  color:#9aa6b2;
  text-align:center;
  margin-top:10px;
}

.link{
  color:#4f7cff;
  font-weight:500;
}

</style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="title">Crear cuenta</div>
    <div class="subtitle">Empezá a construir tu perspectiva</div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="card">

      <div>
        <div class="label">Nombre</div>
        <input type="text" placeholder="Tu nombre" />
      </div>

      <div>
        <div class="label">Apellido</div>
        <input type="text" placeholder="Tu apellido" />
      </div>

      <div>
        <div class="label">Edad</div>
        <input type="number" placeholder="Tu edad" />
      </div>

      <div>
        <div class="label">Email</div>
        <input type="email" placeholder="correo@email.com" />
      </div>

      <div>
        <div class="label">Teléfono</div>
        <input type="tel" placeholder="+54 9 ..." />
      </div>

      <div>
        <div class="label">Contraseña</div>
        <input type="password" placeholder="••••••••" />
      </div>

    </div>

    <div class="helper">
      Al registrarte aceptás los <span class="link">términos</span> y la <span class="link">privacidad</span>.
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <button class="btn">Crear cuenta</button>
  </div>

</div>

</body>
</html>

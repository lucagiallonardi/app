<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Validación</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{background:#eef3f9;height:100vh;display:flex;justify-content:center;align-items:center;}

.phone{
  width:390px;height:844px;background:#fff;border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;flex-direction:column;overflow:hidden;
}

.header{
  padding:18px 20px;
  border-bottom:1px solid #eef2f7;
}

.back{font-size:12px;color:#7a8596;}

.content{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

.from{
  font-size:12px;
  color:#4f7cff;
  font-weight:600;
}

.capture{
  width:100%;
  height:220px;
  border-radius:18px;
  background:linear-gradient(135deg,#ffe4e6,#fff1f2);
  margin-top:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

.card{
  margin-top:14px;
  padding:16px;
  border-radius:16px;
  border:1px solid #e6ecf5;
}

.title{
  font-size:14px;
  font-weight:600;
  color:#2b2f36;
}

.desc{
  margin-top:6px;
  font-size:13px;
  color:#5f6b7a;
  line-height:1.5;
}
</style>
</head>

<body>
<div class="phone">

  <div class="header">
    <div class="back">‹ Atrás</div>
  </div>

  <div class="content">

    <div class="from">Profesor / Jefe / Persona</div>

    <div class="capture">📸</div>

    <div class="card">
      <div class="title">Buen trabajo este mes</div>
      <div class="desc">Reconocieron tu esfuerzo y crecimiento en el proyecto.</div>
    </div>

  </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear Contexto</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #f6f8fc 0%, #eef3f9 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone {
      width: 390px;
      height: 844px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back {
      font-size: 13px;
      color: #7a8596;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: #2b2f36;
    }

    .save {
      font-size: 13px;
      color: #4f7cff;
      font-weight: 500;
    }

    /* Content */
    .content {
      flex: 1;
      padding: 10px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .label {
      font-size: 12px;
      color: #7a8596;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #e3e8f0;
      background: #f9fbfd;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #9bb7ff;
      background: #fff;
    }

    /* Icon selector */
    .icons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: #f2f5fb;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      cursor: pointer;
      transition: 0.2s ease;
      border: 1px solid transparent;
    }

    .icon.active {
      border: 1px solid #4f7cff;
      background: #eef3ff;
    }

    /* Color picker */
    .colors {
      display: flex;
      gap: 10px;
    }

    .color {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color.active {
      border: 2px solid #2b2f36;
    }

    /* Card hint */
    .hint {
      padding: 14px;
      border-radius: 14px;
      background: #f8fbff;
      border: 1px solid #e6ecf5;
      font-size: 12px;
      color: #5f6b7a;
      line-height: 1.5;
    }

    /* Footer */
    .footer {
      padding: 18px 22px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: #4f7cff;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn:hover {
      background: #3e6df0;
    }

  </style>
</head>

<body>

  <div class="phone">

    <!-- Header -->
    <div class="header">
      <div class="back">Atrás</div>
      <div class="title">Nuevo contexto</div>
      <div class="save">Guardar</div>
    </div>

    <!-- Content -->
    <div class="content">

      <div>
        <div class="label">Nombre del contexto</div>
        <input type="text" placeholder="Ej: Trabajo, Facultad, Familia..." />
      </div>

      <div>
        <div class="label">Elegí un icono</div>
        <div class="icons">
          <div class="icon active">💼</div>
          <div class="icon">📚</div>
          <div class="icon">👨‍👩‍👧</div>
          <div class="icon">❤️</div>
          <div class="icon">🏃</div>
          <div class="icon">🎧</div>
          <div class="icon">🎯</div>
          <div class="icon">🌿</div>
          <div class="icon">🧠</div>
          <div class="icon">✨</div>
        </div>
      </div>

      <div>
        <div class="label">Color del contexto</div>
        <div class="colors">
          <div class="color active" style="background:#4f7cff;"></div>
          <div class="color" style="background:#7dd3fc;"></div>
          <div class="color" style="background:#a7f3d0;"></div>
          <div class="color" style="background:#fcd34d;"></div>
          <div class="color" style="background:#fca5a5;"></div>
        </div>
      </div>

      <div class="hint">
        Este contexto te ayuda a organizar recuerdos de una misma área de tu vida.
        No tiene que ser perfecto, solo significativo para vos.
      </div>

    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="btn">Crear contexto</button>
    </div>

  </div>

</body>
</html>

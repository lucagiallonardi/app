<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crear Recurso</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  background:linear-gradient(180deg,#f6f8fc 0%,#eef3f9 100%);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* DEVICE */
.phone{
  width:390px;
  height:844px;
  background:#fff;
  border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eef2f7;
}

.title{
  font-size:16px;
  font-weight:600;
  color:#2b2f36;
}

.save{
  font-size:13px;
  color:#4f7cff;
}

/* CONTENT */
.content{
  flex:1;
  overflow-y:auto;
  padding:16px 20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* INPUT */
.label{
  font-size:11px;
  color:#9aa6b2;
  text-transform:uppercase;
  letter-spacing:0.4px;
  margin-bottom:6px;
}

input, textarea{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #e6ecf5;
  background:#f9fbfd;
  font-size:13px;
  outline:none;
}

textarea{
  resize:none;
  height:90px;
}

/* LINK BOX */
.link-box{
  border:1px solid #e6ecf5;
  border-radius:18px;
  padding:14px;
  background:#f8fbff;
}

.preview{
  margin-top:10px;
  padding:12px;
  border-radius:14px;
  background:#fff;
  border:1px solid #e6ecf5;
  display:flex;
  align-items:center;
  gap:10px;
}

.icon{
  width:40px;
  height:40px;
  border-radius:14px;
  background:#4f7cff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:16px;
}

/* TAG */
.tag{
  display:inline-block;
  margin-top:10px;
  padding:6px 10px;
  border-radius:999px;
  background:#eaf1ff;
  color:#4f7cff;
  font-size:11px;
}

/* FOOTER */
.footer{
  padding:16px 20px;
  border-top:1px solid #eef2f7;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#4f7cff;
  color:#fff;
  font-size:14px;
  font-weight:500;
}

</style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="title">Nuevo recurso</div>
    <div class="save">Guardar</div>
  </div>

  <div class="content">

    <!-- NAME -->
    <div>
      <div class="label">Nombre del recurso</div>
      <input type="text" placeholder="Ej: Música para concentrarme" />
    </div>

    <!-- LINK -->
    <div class="link-box">

      <div>
        <div class="label">Pegar link (YouTube / Spotify)</div>
        <input type="text" placeholder="https://..." />
      </div>

      <!-- PREVIEW SIMULADO -->
      <div class="preview">

        <div class="icon">🎵</div>

        <div>
          <div style="font-size:13px;font-weight:600;color:#2b2f36;">
            Lo-fi Chill Mix
          </div>
          <div style="font-size:11px;color:#7a8596;">
            Recurso detectado (YouTube)
          </div>
        </div>

      </div>

      <div class="tag">Recurso emocional activo</div>

    </div>

    <!-- CONTEXT -->
    <div>
      <div class="label">¿Cuándo usarlo?</div>
      <textarea placeholder="Ej: Cuando estoy ansioso / cuando no puedo concentrarme"></textarea>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <button class="btn">Guardar recurso</button>
  </div>

</div>

</body>
</html>

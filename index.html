<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crear Logro</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  background:linear-gradient(180deg,#f6f8fc 0%,#eef3f9 100%);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.phone{
  width:390px;
  height:844px;
  background:#fff;
  border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.back{font-size:13px;color:#7a8596;}
.title{font-size:16px;font-weight:600;color:#2b2f36;}
.save{font-size:13px;color:#4f7cff;}

/* CONTENT */
.content{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* HERO */
.hero{
  padding:14px;
  border-radius:18px;
  background:#f8fbff;
  border:1px solid #e6ecf5;
  font-size:13px;
  color:#5f6b7a;
  line-height:1.5;
}

/* INPUT */
.label{
  font-size:12px;
  color:#9aa6b2;
  text-transform:uppercase;
  margin-bottom:6px;
}

input, textarea{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #e6ecf5;
  background:#f9fbfd;
  font-size:13px;
  outline:none;
}

textarea{
  height:110px;
  resize:none;
  line-height:1.5;
}

/* SCORE */
.score-box{
  background:#f8fbff;
  border:1px solid #e6ecf5;
  border-radius:18px;
  padding:14px;
}

.score-title{
  font-size:13px;
  font-weight:600;
  color:#2b2f36;
  margin-bottom:10px;
}

.stars{
  display:flex;
  gap:8px;
}

.star{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#eaf1ff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#4f7cff;
  font-size:16px;
}

/* PREVIEW */
.preview{
  border-radius:18px;
  border:1px solid #e6ecf5;
  background:#ffffff;
  padding:14px;
}

.preview-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.preview-type{
  font-size:12px;
  color:#4f7cff;
  font-weight:600;
}

.preview-text{
  font-size:13px;
  color:#2b2f36;
  line-height:1.5;
}

/* FOOTER */
.footer{
  padding:16px 20px;
  border-top:1px solid #eef2f7;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#4f7cff;
  color:#fff;
  font-size:14px;
  font-weight:500;
}

.btn:disabled{
  background:#c8d3f5;
}

</style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="back">‹ Atrás</div>
    <div class="title">Nuevo logro</div>
    <div class="save">Guardar</div>
  </div>

  <div class="content">

    <!-- HERO -->
    <div class="hero">
      Esto no tiene que ser algo “grande”.  
      Si te costó, cuenta. Si te hizo crecer, cuenta.
    </div>

    <!-- TITLE -->
    <div>
      <div class="label">Título del logro</div>
      <input type="text" placeholder="Ej: Terminé un proyecto difícil" />
    </div>

    <!-- DESCRIPTION -->
    <div>
      <div class="label">¿Qué pasó?</div>
      <textarea placeholder="Ej: Me costó mucho, pero lo terminé igual..."></textarea>
    </div>

    <!-- SCORE -->
    <div class="score-box">
      <div class="score-title">Nivel de esfuerzo percibido</div>

      <div class="stars">
        <div class="star">★</div>
        <div class="star">★</div>
        <div class="star">★</div>
        <div class="star">★</div>
        <div class="star">★</div>
      </div>
    </div>

    <!-- PREVIEW -->
    <div class="preview">
      <div class="preview-header">
        <div class="preview-type">Logro</div>
        <div style="font-size:11px;color:#a0a9b8;">Vista previa</div>
      </div>

      <div class="preview-text">
        “Terminé un proyecto difícil que venía evitando hace semanas.”
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <button class="btn">Guardar logro</button>
  </div>

</div>

</body>
</html>

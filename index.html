<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Perfil</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  background:linear-gradient(180deg,#f6f8fc 0%,#eef3f9 100%);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* DEVICE */
.phone{
  width:390px;
  height:844px;
  background:#fff;
  border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  padding:18px 20px;
  border-bottom:1px solid #eef2f7;
}

.title{
  font-size:16px;
  font-weight:600;
  color:#2b2f36;
}

/* CONTENT */
.content{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* SECTION */
.section-title{
  font-size:11px;
  color:#9aa6b2;
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-top:10px;
}

/* CARD */
.card{
  background:#fff;
  border:1px solid #e6ecf5;
  border-radius:16px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.label{
  font-size:11px;
  color:#9aa6b2;
}

.value{
  font-size:13px;
  color:#2b2f36;
  font-weight:500;
}

/* LOGOUT */
.logout{
  margin-top:20px;
  padding:14px;
  border-radius:16px;
  border:1px solid #ffe1e6;
  background:#fff5f7;
  color:#ff5c7a;
  font-size:14px;
  font-weight:500;
  text-align:center;
}

/* NAV */
.nav{
  height:70px;
  border-top:1px solid #eef2f7;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  font-size:12px;
  color:#a0a9b8;
}

.active{
  color:#4f7cff;
}

</style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="title">Perfil</div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="section-title">Datos personales</div>

    <div class="card">
      <div class="label">Nombre</div>
      <div class="value">Luca</div>
    </div>

    <div class="card">
      <div class="label">Apellido</div>
      <div class="value">Giallonardi</div>
    </div>

    <div class="card">
      <div class="label">Edad</div>
      <div class="value">26</div>
    </div>

    <div class="card">
      <div class="label">Email</div>
      <div class="value">luca@email.com</div>
    </div>

    <div class="card">
      <div class="label">Teléfono</div>
      <div class="value">+54 9 11 1234-5678</div>
    </div>

    <div class="logout">
      Cerrar sesión
    </div>

  </div>

  <!-- NAV -->
  <div class="nav">
    <div class="nav-item">Inicio</div>
    <div class="nav-item">Buscar</div>
    <div class="nav-item active">Perfil</div>
  </div>

</div>

</body>
</html>

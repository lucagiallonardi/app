<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crear Validación</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  background:linear-gradient(180deg,#f6f8fc 0%,#eef3f9 100%);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.phone{
  width:390px;
  height:844px;
  background:#fff;
  border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.back{font-size:13px;color:#7a8596;}
.title{font-size:16px;font-weight:600;color:#2b2f36;}
.save{font-size:13px;color:#4f7cff;}

/* CONTENT */
.content{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* UPLOAD */
.upload{
  border:2px dashed #ffd3dc;
  background:#fff7f8;
  border-radius:20px;
  padding:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:#ff5c7a;
}

.upload strong{
  font-size:13px;
}

.upload span{
  font-size:12px;
  color:#a0a9b8;
}

/* LABEL */
.label{
  font-size:12px;
  color:#9aa6b2;
  text-transform:uppercase;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #e6ecf5;
  background:#f9fbfd;
  font-size:13px;
}

/* CHAT PREVIEW */
.chat-preview{
  background:#f8fbff;
  border:1px solid #e6ecf5;
  border-radius:18px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.message{
  background:#fff;
  border:1px solid #e6ecf5;
  padding:12px;
  border-radius:14px;
  font-size:13px;
  color:#2b2f36;
  max-width:85%;
}

.message.self{
  align-self:flex-end;
  background:#eaf1ff;
  border-color:#d6e3ff;
}

.message.other{
  align-self:flex-start;
}

/* FOOTER */
.footer{
  padding:16px 20px;
  border-top:1px solid #eef2f7;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#ff5c7a;
  color:#fff;
  font-size:14px;
  font-weight:500;
}

.btn:disabled{
  background:#f3b6c2;
}

</style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="back">‹ Atrás</div>
    <div class="title">Nueva validación</div>
    <div class="save">Guardar</div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- UPLOAD -->
    <div class="upload">
      <div style="font-size:22px;">💬</div>
      <strong>Subí una captura o mensaje</strong>
      <span>WhatsApp, chat, email, etc.</span>
    </div>

    <!-- SOURCE -->
    <div>
      <div class="label">¿Quién lo dijo?</div>
      <input type="text" placeholder="Ej: Mi jefe / Profesor / Amigo" />
    </div>

    <!-- CHAT PREVIEW -->
    <div class="chat-preview">

      <div class="message other">
        La verdad hiciste un muy buen trabajo en este proyecto.
      </div>

      <div class="message self">
        ¡Gracias! Lo intenté dar lo mejor.
      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <button class="btn">Guardar validación</button>
  </div>

</div>

</body>
</html>

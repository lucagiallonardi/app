<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crear Nota Personal</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  background:linear-gradient(180deg,#f6f8fc 0%,#eef3f9 100%);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.phone{
  width:390px;
  height:844px;
  background:#fff;
  border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.back{font-size:13px;color:#7a8596;}
.title{font-size:16px;font-weight:600;color:#2b2f36;}
.save{font-size:13px;color:#4f7cff;}

/* CONTENT */
.content{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* HERO */
.hero{
  padding:14px;
  border-radius:18px;
  background:#f7f9ff;
  border:1px solid #e6ecf5;
  font-size:13px;
  color:#5f6b7a;
  line-height:1.5;
}

/* TEXTAREA MAIN */
.note-area{
  flex:1;
  display:flex;
  flex-direction:column;
}

textarea{
  flex:1;
  width:100%;
  border-radius:18px;
  border:1px solid #e6ecf5;
  background:#fbfcff;
  padding:16px;
  font-size:14px;
  line-height:1.6;
  color:#2b2f36;
  outline:none;
  resize:none;
}

/* LABEL */
.label{
  font-size:12px;
  color:#9aa6b2;
  text-transform:uppercase;
  margin-bottom:8px;
}

/* PREVIEW */
.preview{
  background:#ffffff;
  border:1px solid #e6ecf5;
  border-radius:18px;
  padding:14px;
}

.preview-title{
  font-size:12px;
  font-weight:600;
  color:#7a5cff;
  margin-bottom:6px;
}

.preview-text{
  font-size:13px;
  color:#2b2f36;
  line-height:1.5;
  font-style:italic;
}

/* FOOTER */
.footer{
  padding:16px 20px;
  border-top:1px solid #eef2f7;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#7a5cff;
  color:#fff;
  font-size:14px;
  font-weight:500;
}

.btn:disabled{
  background:#c8c2f5;
}

</style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="back">‹ Atrás</div>
    <div class="title">Nueva nota</div>
    <div class="save">Guardar</div>
  </div>

  <div class="content">

    <!-- HERO -->
    <div class="hero">
      Esto es un mensaje para vos mismo.  
      No tiene que ser perfecto, tiene que ser honesto.
    </div>

    <!-- NOTE -->
    <div class="note-area">

      <div class="label">Tu mensaje</div>

      <textarea placeholder="Ej: Aunque hoy me sienta mal, ya pasé por esto antes y lo superé..."></textarea>

    </div>

    <!-- PREVIEW -->
    <div class="preview">
      <div class="preview-title">Cómo se verá después</div>
      <div class="preview-text">
        “Aunque hoy me sienta mal, ya pasé por esto antes y lo superé...”
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <button class="btn">Guardar nota</button>
  </div>

</div>

</body>
</html>

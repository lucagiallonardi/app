<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crear Recuerdo</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
  background:linear-gradient(180deg,#f6f8fc 0%,#eef3f9 100%);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.phone{
  width:390px;
  height:844px;
  background:#fff;
  border-radius:28px;
  box-shadow:0 20px 60px rgba(0,0,0,0.12);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.back{font-size:13px;color:#7a8596;}
.title{font-size:16px;font-weight:600;color:#2b2f36;}
.save{font-size:13px;color:#4f7cff;}

/* CONTENT */
.content{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* IMAGE UPLOAD */
.upload{
  width:100%;
  height:220px;
  border-radius:20px;
  border:2px dashed #cfd8ea;
  background:#f8fbff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#7a8596;
}

.upload strong{
  color:#4f7cff;
  font-size:13px;
}

.upload span{
  font-size:12px;
}

/* INPUTS */
.label{
  font-size:12px;
  color:#9aa6b2;
  margin-bottom:6px;
  text-transform:uppercase;
}

input, textarea{
  width:100%;
  border-radius:14px;
  border:1px solid #e6ecf5;
  background:#f9fbfd;
  padding:14px;
  font-size:13px;
  outline:none;
}

textarea{
  height:100px;
  resize:none;
  line-height:1.5;
}

/* PREVIEW CARD */
.preview{
  background:#fffaf2;
  border:1px solid #e6ecf5;
  border-radius:18px;
  overflow:hidden;
}

.preview img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.preview-text{
  padding:12px;
  font-size:13px;
  color:#2b2f36;
}

/* FOOTER */
.footer{
  padding:16px 20px;
  border-top:1px solid #eef2f7;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  background:#4f7cff;
  color:#fff;
  font-size:14px;
  font-weight:500;
}

.btn:disabled{
  background:#c8d3f5;
}

</style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div class="header">
    <div class="back">‹ Atrás</div>
    <div class="title">Nuevo recuerdo</div>
    <div class="save">Guardar</div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- UPLOAD -->
    <div class="upload">
      <div style="font-size:22px;">📸</div>
      <strong>Subí una foto</strong>
      <span>o tocá para elegir desde tu galería</span>
    </div>

    <!-- TITLE -->
    <div>
      <div class="label">Título</div>
      <input type="text" placeholder="Ej: Día que me sentí orgulloso/a" />
    </div>

    <!-- CONTEXT -->
    <div>
      <div class="label">Contexto</div>
      <input type="text" value="Trabajo" disabled />
    </div>

    <!-- NOTE -->
    <div>
      <div class="label">¿Qué querés recordar de esto?</div>
      <textarea placeholder="Ej: Aunque estaba nervioso, lo hice igual..."></textarea>
    </div>

    <!-- PREVIEW -->
    <div class="preview">
      <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=800"/>
      <div class="preview-text">
        Este momento te representa algo importante que lograste.
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    <button class="btn">Guardar recuerdo</button>
  </div>

</div>

</body>
</html>

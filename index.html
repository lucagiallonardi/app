<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar Perspectiva - Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #f6f8fc 0%, #eef3f9 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone {
      width: 390px;
      height: 844px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar {
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: #2b2f36;
    }

    .plus {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: #f2f5fb;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      color: #4f7cff;
      cursor: pointer;
    }

    /* Greeting */
    .greeting {
      padding: 0 22px 10px 22px;
      font-size: 14px;
      color: #7a8596;
    }

    .greeting strong {
      color: #2b2f36;
    }

    /* Context grid */
    .grid {
      padding: 10px 22px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      overflow-y: auto;
      flex: 1;
    }

    .card {
      background: #f8fbff;
      border: 1px solid #e6ecf5;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
    }

    .name {
      font-size: 14px;
      font-weight: 600;
      color: #2b2f36;
    }

    .meta {
      font-size: 12px;
      color: #7a8596;
    }

    /* floating recovery button */
    .floating {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: #4f7cff;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn:hover {
      background: #3e6df0;
    }

    /* bottom nav */
    .nav {
      height: 70px;
      border-top: 1px solid #eef2f7;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #fff;
    }

    .nav-item {
      font-size: 12px;
      color: #a0a9b8;
      text-align: center;
    }

    .nav-item.active {
      color: #4f7cff;
    }

  </style>
</head>

<body>

  <div class="phone">

    <!-- Top -->
    <div>
      <div class="topbar">
        <div class="title">Tus contextos</div>
        <div class="plus">+</div>
      </div>

      <div class="greeting">
        Hoy, si lo necesitás, podés volver a ver <strong>todo lo que ya construiste</strong>.
      </div>
    </div>

    <!-- Grid -->
    <div class="grid">

      <div class="card">
        <div class="icon" style="background:#e0ecff;">💼</div>
        <div class="name">Trabajo</div>
        <div class="meta">3 recuerdos</div>
      </div>

      <div class="card">
        <div class="icon" style="background:#e7f9f0;">📚</div>
        <div class="name">Facultad</div>
        <div class="meta">5 logros</div>
      </div>

      <div class="card">
        <div class="icon" style="background:#ffe7ea;">❤️</div>
        <div class="name">Pareja</div>
        <div class="meta">2 mensajes</div>
      </div>

      <div class="card">
        <div class="icon" style="background:#fff6d6;">👨‍👩‍👧</div>
        <div class="name">Familia</div>
        <div class="meta">4 recuerdos</div>
      </div>

      <div class="card">
        <div class="icon" style="background:#e9f2ff;">🎧</div>
        <div class="name">Hobbies</div>
        <div class="meta">1 recurso</div>
      </div>

      <div class="card">
        <div class="icon" style="background:#edfdf5;">🏃</div>
        <div class="name">Salud</div>
        <div class="meta">2 notas</div>
      </div>

    </div>

    <!-- Floating CTA -->
    <div class="floating">
      <button class="btn">Recuperar Perspectiva</button>
    </div>

    <!-- Bottom nav -->
    <div class="nav">
      <div class="nav-item active">Inicio</div>
      <div class="nav-item">Buscar</div>
      <div class="nav-item">Perfil</div>
    </div>

  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar Perspectiva</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #f6f8fc 0%, #eef3f9 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* PHONE */
    .phone {
      width: 390px;
      height: 844px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* HEADER */
    .header {
      padding: 18px 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      color: #2b2f36;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: #f2f5fb;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #4f7cff;
      font-size: 18px;
    }

    .subtitle {
      padding: 0 20px 10px;
      font-size: 13px;
      color: #7a8596;
      line-height: 1.4;
    }

    /* CONTENT */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px 90px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      background: #f8fbff;
      border: 1px solid #e6ecf5;
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .emoji {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .name {
      font-size: 14px;
      font-weight: 600;
      color: #2b2f36;
    }

    .meta {
      font-size: 12px;
      color: #7a8596;
    }

    /* FIXED BUTTON (no flotante raro) */
    .cta {
      position: absolute;
      bottom: 80px;
      left: 20px;
      right: 20px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: #4f7cff;
      color: white;
      font-size: 14px;
      font-weight: 500;
    }

    /* BOTTOM NAV */
    .nav {
      height: 70px;
      border-top: 1px solid #eef2f7;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #fff;
    }

    .nav-item {
      font-size: 12px;
      color: #a0a9b8;
    }

    .active {
      color: #4f7cff;
    }

  </style>
</head>

<body>

<div class="phone">

  <!-- HEADER -->
  <div>
    <div class="header">
      <div class="title">Tus contextos</div>
      <div class="icon-btn">+</div>
    </div>

    <div class="subtitle">
      Hoy podés volver a ver lo que ya construiste, incluso si ahora no lo sentís así.
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="grid">

      <div class="card">
        <div class="emoji" style="background:#e0ecff;">💼</div>
        <div class="name">Trabajo</div>
        <div class="meta">3 recuerdos</div>
      </div>

      <div class="card">
        <div class="emoji" style="background:#e7f9f0;">📚</div>
        <div class="name">Facultad</div>
        <div class="meta">5 logros</div>
      </div>

      <div class="card">
        <div class="emoji" style="background:#ffe7ea;">❤️</div>
        <div class="name">Pareja</div>
        <div class="meta">2 mensajes</div>
      </div>

      <div class="card">
        <div class="emoji" style="background:#fff6d6;">👨‍👩‍👧</div>
        <div class="name">Familia</div>
        <div class="meta">4 recuerdos</div>
      </div>

    </div>
  </div>

  <!-- CTA FIXED -->
  <div class="cta">
    <button class="btn">Recuperar Perspectiva</button>
  </div>

  <!-- NAV -->
  <div class="nav">
    <div class="nav-item active">Inicio</div>
    <div class="nav-item">Buscar</div>
    <div class="nav-item">Perfil</div>
  </div>

</div>

</body>
</html>
